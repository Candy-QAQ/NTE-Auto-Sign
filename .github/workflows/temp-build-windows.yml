name: Temporary Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - nte.py
      - add_account.py
      - requirements.txt
      - nte.spec
      - add_account.spec
      - .github/workflows/temp-build-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist/windows --workpath build/nte nte.spec
          python -m PyInstaller --noconfirm --clean --distpath dist/windows --workpath build/add-account add_account.spec
      - name: Commit executables
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/windows/nte.exe dist/windows/add_account.exe
          git diff --cached --quiet || git commit -m "build: refresh Windows executables"
          git push
