name: Temporary Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - nte.py
      - add_account.py
      - requirements.txt
      - nte.spec
      - add_account.spec
      - .github/workflows/temp-build-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executables
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist/windows --workpath build/nte nte.spec
          python -m PyInstaller --noconfirm --clean --distpath dist/windows --workpath build/add-account add_account.spec
      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: nte-auto-sign-windows
          path: |
            dist/windows/nte.exe
            dist/windows/add_account.exe
          if-no-files-found: error
